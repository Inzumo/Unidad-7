<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATLUS — Multiverse Physical System</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>

  <!-- ===== PANTALLA DE SELECCIÓN DE MUNDO ===== -->
  <div id="world-select">
    <div class="select-brand">
      <h1>ATLUS</h1>
      <p>Multiverse Physical System</p>
      <span class="select-hint">Elige un mundo para comenzar</span>
    </div>

    <div class="world-grid">
      <button class="world-card" data-dim="0">
        <span class="world-letter">A</span>
        <span class="world-name">Persona 3</span>
        <span class="world-sub">The Dark Hour</span>
        <span class="world-song">Color Your Night</span>
        <span class="world-color" style="background:#0099ff"></span>
      </button>

      <button class="world-card" data-dim="1">
        <span class="world-letter">T</span>
        <span class="world-name">Persona 4</span>
        <span class="world-sub">The TV World</span>
        <span class="world-song">Specialist</span>
        <span class="world-color" style="background:#ffcc00"></span>
      </button>

      <button class="world-card" data-dim="2">
        <span class="world-letter">L</span>
        <span class="world-name">Persona 5</span>
        <span class="world-sub">The Metaverse</span>
        <span class="world-song">I Believe</span>
        <span class="world-color" style="background:#ff0033"></span>
      </button>

      <button class="world-card" data-dim="3">
        <span class="world-letter">U</span>
        <span class="world-name">Catherine</span>
        <span class="world-sub">Tower of Babel</span>
        <span class="world-song">It's a Golden Show</span>
        <span class="world-color" style="background:#ff00aa"></span>
      </button>

      <button class="world-card" data-dim="4">
        <span class="world-letter">S</span>
        <span class="world-name">Metaphor</span>
        <span class="world-sub">Archetype Threads</span>
        <span class="world-song">Battle Theme</span>
        <span class="world-color" style="background:#e6b800"></span>
      </button>
    </div>

    <div class="select-footer">
      <span>Cinco mundos. Una palabra. Tu turno.</span>
    </div>
  </div>

  <!-- ===== UI DEL JUEGO ===== -->
  <div id="game-ui" class="hidden">

    <div id="goal-panel">
      <h2 id="goal-title">Persona 3: The Dark Hour</h2>
      <p id="goal-desc">Gravedad cero y estasis. Dispara impulsos con el cursor para colocar la 'A' dentro de la órbita de la Luna Llena.</p>
    </div>

    <div id="word-bar">
      <span class="word-slot" data-letter="A" data-hint="P3 · The Dark Hour">_</span>
      <span class="word-slot" data-letter="T" data-hint="P4 · The TV World">_</span>
      <span class="word-slot" data-letter="L" data-hint="P5 · The Metaverse">_</span>
      <span class="word-slot" data-letter="U" data-hint="Catherine · Tower of Babel">_</span>
      <span class="word-slot" data-letter="S" data-hint="Metaphor · Archetype Threads">_</span>
    </div>

    <div id="world-signature"></div>

    <div id="notification">
      <div id="notif-title"></div>
      <div id="notif-sub"></div>
    </div>

    <button id="back-to-select">← Cambiar mundo</button>
    <button id="toggle-music">🔊 Música</button>

    <!-- HUD específico de P4 -->
    <div id="p4-hud" class="hidden">
      <span id="p4-hits">CHANNEL 0 / 5</span>
    </div>

  </div>

  <main id="canvas-holder"></main>

  <script src="main.js"></script>
</body>
</html>
