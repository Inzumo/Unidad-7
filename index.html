<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATLUS — Multiverse Physical System</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>

  <!-- PANTALLA DE SELECCIÓN -->
  <div id="world-select">
    <div class="select-bg"></div>
    <div class="select-content">
      <div class="select-brand">
        <h1>ATLUS</h1>
        <p>Multiverse Physical System</p>
        <span class="select-hint">— Elige un mundo —</span>
      </div>

      <div class="world-grid">
        <button class="world-card" data-dim="0">
          <span class="world-number">01</span>
          <span class="world-symbol">◐</span>
          <span class="world-sub">The Dark Hour</span>
          <span class="world-song">♪ Color Your Night</span>
          <span class="world-color" style="background:#0099ff"></span>
        </button>
        <button class="world-card" data-dim="1">
          <span class="world-number">02</span>
          <span class="world-symbol">▣</span>
          <span class="world-sub">The TV World</span>
          <span class="world-song">♪ Specialist</span>
          <span class="world-color" style="background:#ffcc00"></span>
        </button>
        <button class="world-card" data-dim="2">
          <span class="world-number">03</span>
          <span class="world-symbol">✦</span>
          <span class="world-sub">The Metaverse</span>
          <span class="world-song">♪ I Believe</span>
          <span class="world-color" style="background:#ff0033"></span>
        </button>
        <button class="world-card" data-dim="3">
          <span class="world-number">04</span>
          <span class="world-symbol">◆</span>
          <span class="world-sub">Tower of Babel</span>
          <span class="world-song">♪ It's a Golden Show</span>
          <span class="world-color" style="background:#ff00aa"></span>
        </button>
        <button class="world-card" data-dim="4">
          <span class="world-number">05</span>
          <span class="world-symbol">✧</span>
          <span class="world-sub">Archetype Threads</span>
          <span class="world-song">♪ Battle Theme</span>
          <span class="world-color" style="background:#e6b800"></span>
        </button>
      </div>

      <div class="select-footer">
        <span>Cinco mundos. Una palabra. Tu turno.</span>
      </div>
    </div>
  </div>

  <!-- UI DEL JUEGO -->
  <div id="game-ui" class="hidden">

    <!-- BRAND QUE SE FORMA -->
    <div id="brand-bar">
      <div id="brand-word">
        <span class="brand-letter" data-index="0">_</span>
        <span class="brand-letter" data-index="1">_</span>
        <span class="brand-letter" data-index="2">_</span>
        <span class="brand-letter" data-index="3">_</span>
        <span class="brand-letter" data-index="4">_</span>
      </div>
      <div id="brand-sub">Multiverse Physical System</div>
    </div>

    <!-- Barra superior -->
    <div id="top-bar">
      <div class="top-left">
        <button id="back-to-select" class="ui-btn">← Mundos</button>
        <button id="reset-all" class="ui-btn danger">⟳ Reiniciar</button>
      </div>
      <div id="world-badge">
        <span id="world-badge-num">MUNDO 01</span>
        <span id="world-badge-sub">The Dark Hour</span>
      </div>
      <div class="top-right">
        <button id="toggle-music" class="ui-btn">🔊</button>
      </div>
    </div>

    <!-- Panel de objetivo -->
    <div id="goal-panel">
      <div class="goal-label">OBJETIVO</div>
      <h2 id="goal-title">—</h2>
      <p id="goal-desc">—</p>
    </div>

    <!-- HUD P4 -->
    <div id="p4-hud" class="hidden">
      <span id="p4-hits">CHANNEL 0 / 5</span>
    </div>

    <!-- HUD Catherine -->
    <div id="catherine-hud" class="hidden">
      <span id="cath-height">ALTURA: 0 / 7</span>
    </div>

    <!-- Firma visual -->
    <div id="world-signature"></div>

    <!-- Notificación -->
    <div id="notification">
      <div id="notif-title"></div>
      <div id="notif-sub"></div>
    </div>

    <!-- Barra de palabra -->
    <div id="word-bar">
      <div class="word-label">PALABRA DESCUBIERTA</div>
      <div class="word-slots">
        <span class="word-slot" data-index="0">?</span>
        <span class="word-slot" data-index="1">?</span>
        <span class="word-slot" data-index="2">?</span>
        <span class="word-slot" data-index="3">?</span>
        <span class="word-slot" data-index="4">?</span>
      </div>
    </div>

  </div>

  <main id="canvas-holder"></main>

  <script src="main.js"></script>
</body>
</html>
